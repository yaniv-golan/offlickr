name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc*"
      - "v*.*.*-beta*"
      - "v*.*.*-alpha*"
  # Manual smoke test of the publish path. Deliberately has no PyPI option:
  # a dispatched run can only ever reach TestPyPI, so exercising this workflow
  # can never burn a real version number.
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target (TestPyPI only; real PyPI is tag-push only)"
        type: choice
        options:
          - testpypi
        default: testpypi

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
      notes_file: ${{ steps.vars.outputs.notes_file }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - id: vars
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # No tag on a dispatched run: take the version from pyproject and
            # skip the release-notes gate, which only applies to real releases.
            VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "notes_file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ -(rc|beta|alpha) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          NOTES="docs/release-notes/v${VERSION}.md"
          PATCH_FALLBACK="docs/release-notes/v$(echo "$VERSION" | cut -d. -f1-2).x-patch.md"
          if [ -f "$NOTES" ]; then
            echo "notes_file=$NOTES" >> "$GITHUB_OUTPUT"
          elif [ -f "$PATCH_FALLBACK" ]; then
            echo "notes_file=$PATCH_FALLBACK" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing release notes. Expected $NOTES or $PATCH_FALLBACK"
            exit 1
          fi
      - name: Verify pyproject version matches tag
        if: github.event_name == 'push'
        run: |
          PYPROJECT_VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$PYPROJECT_VERSION" != "${{ steps.vars.outputs.version }}" ]; then
            echo "::error::pyproject.toml version ($PYPROJECT_VERSION) does not match tag (${{ steps.vars.outputs.version }})"
            exit 1
          fi
      - name: Verify CHANGELOG has a dated section for this version
        if: github.event_name == 'push'
        run: |
          if ! grep -qE "^## \[${{ steps.vars.outputs.version }}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing a dated section for version ${{ steps.vars.outputs.version }}"
            exit 1
          fi

  build:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          python-version: "3.13"
      - run: uv build
      - name: Generate SBOM
        run: |
          uv run --with cyclonedx-bom python -m cyclonedx_py environment -o sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: |
            dist/
            sbom.cdx.json

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    # Tag push -> pypi; manual dispatch -> testpypi. Configure Trusted
    # Publishing separately in each environment.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write  # for PyPI trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: .
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          # Both branches explicit: an empty repository-url is not reliably
          # treated as "use the default" by the action.
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  github-release:
    needs: [preflight, build]
    if: github.event_name == 'push'  # no GitHub Release for TestPyPI smoke runs
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create GitHub releases
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: .
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "offlickr ${GITHUB_REF_NAME}" \
            --notes-file "${{ needs.preflight.outputs.notes_file }}" \
            ${{ needs.preflight.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            dist/* sbom.cdx.json \
            || gh release upload "${GITHUB_REF_NAME}" dist/* sbom.cdx.json --clobber
